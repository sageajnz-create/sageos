---
name: Build disk images

on:
  # The nightly VM gate follows the scheduled container build instead of using
  # an independent clock. This guarantees that it pulls the image published by
  # the successful build which triggered it, even when that build runs slowly.
  workflow_run:
    workflows:
      - Build container image
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso.toml'
      - 'disk_config/Containerfile.buildroot'
      - 'scripts/validate-qcow2.exp'
      - 'Justfile'
      - 'sageos.env'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"
  BIB_BUILD_BASE: "quay.io/fedora/fedora-bootc:42"
  BIB_BUILD_IMAGE: "localhost/sageos-bib-buildroot:fedora42"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    # workflow_run is privileged; only trust the scheduled default-branch build
    # and never check out or execute artifacts from a pull-request run.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    # SageOS currently supports x86_64 only. Do not imply an untested arm64
    # artifact merely because GitHub provides ARM runners.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        disk-type: ${{ github.event_name == 'workflow_run' && fromJSON('["qcow2"]') || fromJSON('["qcow2", "anaconda-iso"]') }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # The sageos package on GHCR is private; bib pulls as root via sudo
      # podman, so the login must land in root's auth file too.
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build disk images
        id: build
        shell: bash
        env:
          CONFIG_FILE: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
        run: |
          set -euo pipefail

          POLICY_FILE="${GITHUB_WORKSPACE}/system_files/etc/containers/policy.json"
          PUBLIC_KEY="${GITHUB_WORKSPACE}/system_files/etc/pki/containers/cosign.pub"
          REGISTRIES_D_FILE="${GITHUB_WORKSPACE}/system_files/etc/containers/registries.d/ghcr.io-sageajnz-create-sageos.yaml"
          python3 -m json.tool "${POLICY_FILE}" >/dev/null
          test -s "${PUBLIC_KEY}"
          test -s "${REGISTRIES_D_FILE}"
          echo "${GH_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build.yml" \
            --source-ref refs/heads/main

          # Ubuntu runners and BIB must agree on the storage driver before the
          # host container store is shared with the privileged builder.
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '%s\n' \
            '[storage]' \
            'driver = "overlay"' \
            'runroot = "/run/containers/storage"' \
            'graphroot = "/var/lib/containers/storage"' \
            | sudo tee /etc/containers/storage.conf >/dev/null

          mkdir -p output
          sudo podman pull "${BIB_IMAGE}"
          sudo podman pull "${IMAGE_REF}"
          BUILD_CONTAINER_ARGS=()
          if [[ "${DISK_TYPE}" == "qcow2" ]]; then
            sudo podman pull "${BIB_BUILD_BASE}"
            sudo podman build \
              --pull=never \
              --tag "${BIB_BUILD_IMAGE}" \
              --file disk_config/Containerfile.buildroot \
              .
            BUILD_CONTAINER_ARGS=(--build-container "${BIB_BUILD_IMAGE}")
          fi
          # osbuild replaces /etc with its build container inside bubblewrap.
          # QCOW2 therefore uses the SageOS policy/key/registries.d plus mkfs.btrfs;
          # Anaconda ISO retains the source image as the nested build root.
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "${PWD}/output:/output" \
            --volume "${CONFIG_FILE}:/config.toml:ro" \
            --volume "${POLICY_FILE}:/etc/containers/policy.json:ro" \
            --volume "${PUBLIC_KEY}:/etc/pki/containers/cosign.pub:ro" \
            --volume "${REGISTRIES_D_FILE}:/etc/containers/registries.d/ghcr.io-sageajnz-create-sageos.yaml:ro" \
            "${BIB_IMAGE}" \
            build \
            --output /output \
            --chown "${USER_UID}:${USER_GID}" \
            --use-librepo=True \
            --rootfs btrfs \
            "${BUILD_CONTAINER_ARGS[@]}" \
            --type "${{ matrix.disk-type }}" \
            "${IMAGE_REF}"

          echo "output-directory=${PWD}/output" >> "${GITHUB_OUTPUT}"

      - name: Install VM validation dependencies
        if: matrix.disk-type == 'qcow2'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect ovmf qemu-system-x86
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi

      - name: Boot and validate qcow2
        if: matrix.disk-type == 'qcow2'
        run: just validate-vm-qcow2 "${{ steps.build.outputs.output-directory }}/qcow2/disk.qcow2"

      - name: Upload VM diagnostics
        if: always() && matrix.disk-type == 'qcow2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-validation-${{ github.run_id }}
          path: output/vm-validation
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.disk-type }}-${{ github.run_id }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
